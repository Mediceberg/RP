<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>REPUTA — Decentralized Reputation System</title>
<style>
/* 1. Global Reset & Typography */
body{margin:0;font-family:'Inter',sans-serif;background:#0b0f19;color:#e8eef7}
header{padding:40px 20px;text-align:center}
.hero{max-width:800px;margin:auto}
.hero img{width:140px;margin-bottom:20px}
h1{font-size:42px;margin:0}
p{color:#94a3b8;font-size:18px;margin-top:10px;line-height:1.6}

/* 2. Actions & Buttons */
.actions{margin-top:30px}
.btn{padding:12px 26px;border-radius:12px;font-size:16px;font-weight:600;cursor:pointer;border:0;transition: background 0.3s;}
.primary{background:linear-gradient(90deg,#06b6d4,#3b82f6);color:#fff;box-shadow: 0 4px 15px rgba(6, 182, 212, 0.4);}
.primary:hover{background:linear-gradient(90deg,#3b82f6,#06b6d4);}

/* 3. Layout & Sections */
section{padding:60px 20px;max-width:1100px;margin:auto}
.section-title{text-align:center;font-size:32px;margin-bottom:20px;color:#fff}
.features-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:22px;margin-top:30px}
.card{background:#111829;padding:22px;border-radius:14px;border:1px solid #1d2433;transition: border-color 0.3s;}
.card:hover{border-color: #3b82f6;}
h3{margin:0;font-size:20px;color:#fff}

/* 4. Utility & Footer */
footer{text-align:center;padding:20px;color:#6b7280;font-size:14px;border-top:1px solid #1d2433;margin-top:40px}
.lang-switch{position:fixed;top:15px;right:15px;display:flex;gap:8px;z-index:10}
.lang-switch button{background:#1e2637;color:#9fb4d6;border:1px solid #2a3550;padding:6px 12px;border-radius:8px;cursor:pointer}

/* 5. Custom Styles for Reputa Score Section */
.score-flex-container {
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    justify-content:space-between;
    max-width:900px;
    margin:auto;
    padding-top:20px;
}
.score-details ul{
    list-style:none;
    padding-left:0;
    margin-top: 20px;
}
.score-details ul li{
    margin-bottom:15px;
    position:relative;
    padding-right: 35px; /* لمساحة أيقونة التعداد */
    color: #e8eef7;
}
.score-details ul li::before {
    content: '⭐'; /* أيقونة بسيطة */
    position: absolute;
    right: 0;
    color: #06b6d4;
    font-size: 1.2em;
}
.score-details {
    flex: 1 1 400px; 
    padding-right: 20px;
}
.score-image {
    flex: 1 1 300px; 
    text-align: center;
}
.score-image img {
    width: 100%;
    max-width: 300px; /* لضمان عدم تمدد الصورة أكثر من اللازم */
    height: auto; 
    border-radius: 20px; 
    box-shadow: 0 0 30px rgba(59, 130, 246, 0.5); /* إضافة ظل لوني جذاب */
}

/* 6. Responsive Adjustments */
@media (max-width: 768px) {
    .hero img{width:100px;margin-bottom:15px}
    h1{font-size:32px}
    .section-title{font-size:26px}
    .score-details{padding-right:0; margin-bottom:20px;}
}
</style>
</head>
